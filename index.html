<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>

    <!-- logo -->
    <link rel="icon" href="./assets/images/lk_logo_white.png" />

    <!-- css -->
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />

    <!-- fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- header -->
    <header>
      <div class="container header__container">
        <!-- left header -->
        <div class="header__left">
          <img
            class="header__left--icon"
            src="./assets/images/lk_logo_white.png"
            alt="logo_lk.png"
          />
          <p class="header__left--text">Trung Kien</p>
        </div>

        <!-- right header -->
        <div class="header__right">
          <ul>
            <a href="#about">Về tôi</a>
            <a href="#skills">Kỹ năng</a>
            <a href="#projects">Dự án</a>
            <a href="#connect">Kết nối</a>
          </ul>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero__container">
        <video autoplay muted loop playsinline>
          <source src="./assets/videos/star_banner.mp4" type="video/mp4" />
        </video>

        <div class="hero__container--text">
          <p>Xin chào, mình là</p>
          <h1>Lê Trung Kiên</h1>
        </div>
      </div>
    </section>
  </body>
</html>
