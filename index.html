<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | ClickHouse Style</title>
    <!-- Font Inter + JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 (free icons) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- CSS files -->
    <link rel="stylesheet" href="./assets/css/root.css" />
    <link rel="stylesheet" href="./assets/css/stlye.css" />
  </head>
  <body>
    <!-- ================= HEADER + NAV ================= -->
    <header class="header">
      <div class="header__container">
        <div class="logo">My<span class="logo__accent">Portfolio</span></div>
        <nav class="nav">
          <a href="#skills" class="nav__link">Kỹ năng</a>

          <a href="#projects" class="nav__link">Dự án</a>
          <a href="#about" class="nav__link">Giới thiệu</a>
          <a href="#contact" class="nav__link">Liên hệ</a>
        </nav>
      </div>
    </header>

    <!-- ================= BANNER TO – VIDEO NỀN ================= -->
    <section class="banner">
      <!-- Video mẫu từ Pexels (có thể thay bằng link video của bạn) -->
      <video class="banner__video" autoplay muted loop playsinline>
        <source src="./assets/videos/banner.mp4" type="video/mp4" />
      </video>
      <div class="banner__overlay">
        <div class="banner__greeting">Xin chào</div>
        <h1 class="banner__name">
          Mình là
          <span
            style="
              background: linear-gradient(135deg, #92fe9d, #ffffff);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
            "
            >Lê Trung Kiên</span
          >
        </h1>
        <div class="banner__buttons">
          <a href="#projects" class="button-primary">DỰ ÁN</a>
          <a href="#about" class="button-secondary">THÔNG TIN</a>
        </div>
      </div>
    </section>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
      <div class="container">
        <div class="footer__text">
          © 2026 - Portfolio cá nhân. Thiết kế theo phong cách ClickHouse.
        </div>
      </div>
    </footer>

    <script src="./assets/scripts/animation.js"></script>
  </body>
</html>
